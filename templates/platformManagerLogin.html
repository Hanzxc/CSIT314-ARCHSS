<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platform Manager Log in - Interior Design Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-card">
        <h1>Interior Design Platform</h1>
        <p class="subtitle">Platform Manager · Log in to your account</p>
        {% if errorMessage %}<div class="message error" role="alert">{{ errorMessage }}</div>{% endif %}
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <div class="message {{ category }}" role="status">{{ msg }}</div>
        {% endfor %}
        <form method="POST" action="{{ url_for('platformManagerLogin') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="submit" class="btn-primary">Log in</button>
        </form>
    </div>
</body>
</html>
