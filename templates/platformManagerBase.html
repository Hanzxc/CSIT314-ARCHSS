<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Platform Manager - Interior Design Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- shared layout for every manager page: header with Log out (US40) + side menu -->
    <div class="header">
        <span class="logo">Interior Design Platform</span>
        <div class="user-info">
            <span>Logged in as {{ username }} (Platform Manager)</span>
            <form method="POST" action="{{ url_for('platformManagerLogout') }}">
                <button type="submit" class="btn-outline">Log out</button>
            </form>
        </div>
    </div>
    <div class="layout">
        <nav class="sidebar" aria-label="Manager navigation">
            <a href="{{ url_for('platformManagerDashboard') }}" class="{% if activePage == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('idpCategories') }}" class="{% if activePage == 'categories' %}active{% endif %}">IDP Categories</a>
        </nav>
        <main class="content">
            {% for category, msg in get_flashed_messages(with_categories=true) %}
                <div class="message {{ category }}" role="status">{% if category == 'success' %}&#10003; {% endif %}{{ msg }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
