<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Customer - Interior Design Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <span class="logo">Interior Design Platform</span>
        <div class="user-info">
            <span>Logged in as {{ account.username if account else headerUsername }} (Customer)</span>
            <form method="POST" action="{{ url_for('customerLogout') }}">
                <button type="submit" class="btn-outline">Log out</button>
            </form>
        </div>
    </div>
    <div class="layout">
        <nav class="sidebar" aria-label="Customer navigation">
            <a href="{{ url_for('customerDashboard') }}" class="{% if activePage == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('searchIDPs') }}" class="{% if activePage == 'searchIDPs' %}active{% endif %}">Search IDPs</a>
            <a href="{{ url_for('savedList') }}" class="{% if activePage == 'savedIDPs' %}active{% endif %}">Saved IDPs</a>
        </nav>
        <main class="content">
            {% for category, msg in get_flashed_messages(with_categories=true) %}
                <div class="message {{ category }}" role="status">{{ msg }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
